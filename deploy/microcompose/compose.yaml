# 3-node k3rs cluster, one microVM per node (microcompose + Cloud Hypervisor).
#
#   node1  `k3rs server`: control plane (SQLite) + kubelet/kube-proxy + k3rs-dns
#   node2  `k3rs agent --server https://node1:6443 --token-file /etc/k3rs/token`
#   node3  `k3rs agent ...` (same)
#
# The binary is NOT baked into the image: `sync.sh` scp's the one `k3rs`
# binary into /usr/local/bin and restarts k3rs.service, so a rebuild is live in
# seconds. Only the OS layer (containerd, crun, CNI plugins, units) is baked.
#
# 1 GiB per VM until each node idles under 512 MiB; then shrink mem_limit.
#
#   ./up.sh            # build, boot, sync (server, token, agents)
#   ./sync.sh          # after a rebuild: push k3rs + restart
#   ./acceptance.sh    # cluster + authn/RBAC acceptance (14 checks)
name: k3rs

services:
  node1:
    image: debian-13-genericcloud
    mem_limit: 1g
    cpus: 2
    build:
      context: ./build
    x-vm:
      disk_size: 10G
    labels: { role: control-plane }
    networks:
      default: { ipv4_address: 10.72.0.2 }
    # kubectl from the host: https://127.0.0.1:6443 (cert SAN: localhost)
    ports:
      - "127.0.0.1:6443:6443"

  node2:
    image: debian-13-genericcloud
    mem_limit: 1g
    cpus: 2
    build:
      context: ./build
    x-vm:
      disk_size: 10G
    labels: { role: worker }
    networks:
      default: { ipv4_address: 10.72.0.3 }

  node3:
    image: debian-13-genericcloud
    mem_limit: 1g
    cpus: 2
    build:
      context: ./build
    x-vm:
      disk_size: 10G
    labels: { role: worker }
    networks:
      default: { ipv4_address: 10.72.0.4 }

# 10.71.0.0/16 is reserved by microcompose; 10.88.0.0/24 is the m2b-* projects.
# Pod CIDR (10.244.0.0/16) and service CIDR (10.96.0.0/12) must not overlap.
networks:
  default:
    ipam:
      config:
        - subnet: 10.72.0.0/24
