# Local GitHub Actions runners: `docker compose -f ci/local-runner/compose.yml up -d --scale runner=3`
# Each container = one ephemeral runner = one job, with its own dockerd.
services:
  runner:
    build: .
    image: kubernetes-rs-local-runner:latest
    restart: always            # ephemeral runner exits after its job; come back fresh
    privileged: true           # for the in-container dockerd. With sysbox installed,
                               # replace with `runtime: sysbox-runc` and drop this line.
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-indyjonesnl/kubernetes-rs}
      GITHUB_PAT: ${GITHUB_PAT:?set GITHUB_PAT in ci/local-runner/.env}
      RUNNER_LABELS: kubernetes-rs
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /cache/sccache
      SCCACHE_CACHE_SIZE: 20G
    volumes:
      - sccache:/cache/sccache
      - /var/lib/docker           # anonymous per-container volume: dockerd can't sit on overlayfs;
                                  # survives the restart so images stay cached between jobs
    deploy:
      resources:
        limits: { cpus: "8", memory: 16g }
volumes:
  sccache:
