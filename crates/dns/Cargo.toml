[package]
name = "kubernetes-rs-dns"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "kubernetes_rs_dns"
path = "src/lib.rs"

[[bin]]
name = "kubernetes-rs-dns"
path = "src/main.rs"

[features]
mimalloc = ["dep:mimalloc"]
default = []
sqlite = ["kubernetes-rs-storage/sqlite"]
redis = ["kubernetes-rs-storage/redis"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
kubernetes-rs-common = { path = "../common" }
kubernetes-rs-storage = { path = "../storage" }
kubernetes-rs-client = { path = "../client" }
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
serde_json = { workspace = true }
futures = { workspace = true }
hickory-server = { version = "0.26", default-features = false }
hickory-proto = { version = "0.26", default-features = false }
