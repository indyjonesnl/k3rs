[package]
name = "kubernetes-rs-kubelet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "kubelet"
path = "src/main.rs"

[lib]
name = "kubernetes_rs_kubelet"
path = "src/lib.rs"
# Unit tests live in tests/it: a second compilation of the lib as a test
# target costs as much as the lib itself.
test = false

[features]
mimalloc = ["dep:mimalloc"]
default = []
sqlite = ["kubernetes-rs-storage/sqlite"]
redis = ["kubernetes-rs-storage/redis"]

[dependencies]
# Client certificate bootstrap (certificate/bootstrap.rs): key + CSR generation, cert expiry checks.
rcgen = { workspace = true }
x509-parser = { workspace = true }
mimalloc = { version = "0.1", optional = true }
kubernetes-rs-common = { path = "../common", features = ["axum-support", "clap-support"] }
pem.workspace = true
prometheus.workspace = true
# api-client: StorageBackend::Api lets the in-cluster kubelet read/write via
# the api-server while keeping its Arc<StorageBackend> handle unchanged.
kubernetes-rs-storage = { path = "../storage", features = ["api-client"] }
kubernetes-rs-client = { path = "../client" }
kubernetes-rs-middleware = { path = "../middleware" } # user_from_client_cert_der / PeerCertificates (x509 authn)
kubernetes-rs-cri = { path = "../cri" }
kubernetes-rs-csi = { path = "../csi" }
kubernetes-rs-streamproxy = { path = "../streamproxy" }
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
regex = "1.10"
sha1 = "0.10"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
chrono.workspace = true
axum.workspace = true
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
futures-util = "0.3"
async-stream.workspace = true
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tonic.workspace = true
tonic-health.workspace = true
prost.workspace = true
prost-types.workspace = true
http = "1"
sysinfo = "0.32"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
async-trait = { workspace = true }
# CSI Node-service client dials the driver's unix socket (same connector shape
# as kubernetes-rs-cri): tonic 0.12 rides hyper 1.x, so a tokio UnixStream is
# wrapped in hyper_util's TokioIo.
hyper-util = { version = "0.1", features = ["client", "tokio"] }
tower = { workspace = true }
inotify = "0.11"
# PodCertificateManager key generation + proof-of-possession
# (pkg/kubelet/podcertificate/podcertificatemanager.go generateKeyAndProof):
# ED25519 / ECDSA P-256,384,521 / RSA-PSS, PKCS#8 private keys, PKIX public keys.
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.9"
# Node log query (`/logs/?query=`): query parsing, gzip, streamed body.
url = "2.5"
flate2 = "1"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Fake CRI RuntimeService server for CRI-less concurrency/stale-incarnation tests (#1115).
kubernetes-rs-cri = { path = "../cri", features = ["fake-server"] }
tempfile = "3"
serial_test = { workspace = true }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
# Fake CSI driver gRPC server over a unix socket (volume_plugins::csi_client).
tokio-stream = { version = "0.1", features = ["net"] }
# Real-TLS test server for HTTPS lifecycle-hook coverage (NC prestop-https).
rcgen = { workspace = true }
time = "0.3" # kubelet_bootstrap tests: cert validity windows
rustls = { workspace = true }
tokio-rustls = { workspace = true }
