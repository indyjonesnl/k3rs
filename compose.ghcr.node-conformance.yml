# GHCR image-name overlay for the compose.node-conformance.yml single-node
# stack. Same images as compose.ghcr.yml — both stacks build identical
# services.Dockerfile targets. Consumed by scripts/run-node-conformance.sh
# when KUBERNETES_RS_IMAGE_TAG is set (pull instead of build, with fallback).
# Keep in sync with compose.node-conformance.yml —
# scripts/tests/test-ghcr-overlays.sh enforces it.

services:
  rhino:
    image: "ghcr.io/indyjonesnl/kubernetes-rs/rhino:${KUBERNETES_RS_IMAGE_TAG:-main}"
  api-server:
    image: "ghcr.io/indyjonesnl/kubernetes-rs/api-server:${KUBERNETES_RS_IMAGE_TAG:-main}"
  kubelet:
    image: "ghcr.io/indyjonesnl/kubernetes-rs/kubelet:${KUBERNETES_RS_IMAGE_TAG:-main}"
  scheduler:
    image: "ghcr.io/indyjonesnl/kubernetes-rs/scheduler:${KUBERNETES_RS_IMAGE_TAG:-main}"
  controller-manager:
    image: "ghcr.io/indyjonesnl/kubernetes-rs/controller-manager:${KUBERNETES_RS_IMAGE_TAG:-main}"
  # CRI runtime image (containerd + crun + CNI) the kubelet talks to.
  containerd:
    image: "ghcr.io/indyjonesnl/kubernetes-rs/containerd:${KUBERNETES_RS_IMAGE_TAG:-main}"
